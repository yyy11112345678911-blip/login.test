<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-screen flex flex-col items-center justify-center">


<img src="image/img.png" alt="logo" class="w-30 h-8 rounded-1xl md:w-45 h-10">


<main class="w-2/3 h-4/7 bg-waith-200 rounded-xl shadow-2xl md:w-1/2 h-1/2 lg:w-2/5 h-1/3 lg:w-2/6 ">

    <div class="flex h-11 md:h-14">
        <button class=" w-1/2 bg-[#d4e1ff] flex flex-col items-center justify-center rounded-tl-2xl text-[#5e5e5e] ">
            <span class=" text-xm md:text-xm font-bold ">ثبت نام</span>
            <span class="text-xs md:text-xm"> در راسا مارکت</span>
        </button>
        <button class="w-1/2 bg-waith flex flex-col items-center justify-center rounded-tr-2xl ">
            <span class="text-xm md:text-xm font-bold text-[#0000ff]">ورود</span>
            <span class="text-xs md:text-xm text-[#0000ff]">به راسا مارکت</span>
        </button>
    </div>

    <div class="flex items-start justify-center">
        <span class="text-[#5e5e5e] text-sx font-bold mt-6 lg:text-lg "> ورود به حساب کاربری</span>
    </div>
    <div dir="rtl" class="mt-10">
        <span class="text-xs  text-[#5e5e5e] px-2">
            ایمیل/شماره موبایل
        </span>
        <label class="flex items-start justify-center"> <input type="text"
                                                               class=" bg-[#eaeaea] w-9/10  rounded-xl lg:w-4/5 ">
        </label>
    </div>

    <div dir="rtl" class="mt-8">
        <span class="text-xs  text-[#5e5e5e] px-2">
            رمز عبور
        </span>

        <label class="flex items-start justify-center "> <input type="text"
                                                                class=" bg-[#eaeaea] w-9/10  rounded-xl lg:w-4/5">
        </label>
        <a href="" class="text-xs  text-[#00a8fd] px-2 ">رمز خود را فراموش کردم</a>
    </div>
    <div class="flex justify-end">
        <label dir="rtl" class="text-[#5e5e5e] text-xs font-bold pt-5">
            <input type="checkbox">
            مرا به خاطر بسپار
        </label>
    </div>

    <div class="flex justify-center pt-6">
        <button class="w-9/10 h-7 bg-[#0000ff] text-[#ffffff] rounded-2xl ">ورود به راسا مارکت</button>
    </div>
</main>


</body>

</html>
